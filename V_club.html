<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V_CLUB | Official Store</title>
    <style>
        body {
            background-color: #0d0f17;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: #161926;
            padding: 15px 40px;
            border-bottom: 2px solid #6366f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #6366f1;
            letter-spacing: 2px;
        }
        .hero { padding: 50px 20px; }
        .hero h1 { font-size: 40px; margin-bottom: 10px; }
        .hero p { color: #94a3b8; font-size: 18px; }
        .btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background: #4f46e5; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #161926;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card h3 { margin: 10px 0 5px; font-size: 18px; }
        .price { color: #6366f1; font-size: 20px; font-weight: bold; margin-bottom: 10px; }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: #161926;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: left;
            border: 1px solid #6366f1;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #0d0f17;
            border: 1px solid #2d3748;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">V_CLUB</div>
        <button class="btn" onclick="addProduct()">+ Add T-Shirt</button>
    </header>

    <div class="hero">
        <h1>WELCOME TO V_CLUB</h1>
        <p>Exclusive Streetwear & Apparel Collection</p>
    </div>

    <div class="container">
        <h2 style="text-align: left;">Latest Apparel Drops</h2>
        <!-- المتجر فارغ وجاهز لتضيف فيه منتجاتك فقط بضغط زر Add T-Shirt -->
        <div class="grid" id="productGrid"></div>
    </div>

    <!-- Buy Now Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 15px; color: #6366f1;">Order Item</h3>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="custName" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="custPhone" placeholder="010xxxxxxx">
            </div>
            <div class="form-group">
                <label>Size</label>
                <select id="custSize">
                    <option>Small (S)</option>
                    <option selected>Medium (M)</option>
                    <option>Large (L)</option>
                    <option>X-Large (XL)</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" onclick="submitOrder()" style="flex: 1;">Confirm Order</button>
                <button class="btn" onclick="closeOrderModal()" style="background: #334155; flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // اكتب رقم الواتساب الخاص بك هنا (مع كود الدولة)
        const MY_WHATSAPP_NUMBER = "201007587568"; 

        let selectedProduct = "";
        let selectedPrice = "";

        function buyNow(title, price) {
            selectedProduct = title;
            selectedPrice = price;
            document.getElementById('modalTitle').innerText = "Buy " + title + " ($" + price + ")";
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function submitOrder() {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let size = document.getElementById('custSize').value;

            if(!name || !phone) {
                alert("Please fill in your name and phone number.");
                return;
            }

            let message = `Hello V_CLUB! I want to order:%0A- Product: ${selectedProduct}%0A- Price: $${selectedPrice}%0A- Size: ${size}%0A- Customer Name: ${name}%0A- Phone: ${phone}`;
            
            window.open(`https://wa.me/${const MY_WHATSAPP_NUMBER = "201007587568";}?text=${message}`, '_blank');
            closeOrderModal();
        }

        function addProduct() {
            let title = prompt("Enter T-Shirt Name:", "V_CLUB New Tee");
            let price = prompt("Enter Price ($):", "30.00");
            let img = prompt("Enter Image URL:", "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=500");

            if (title && price) {
                let grid = document.getElementById('productGrid');
                grid.innerHTML += `
                    <div class="card">
                        <img src="${img}" alt="${title}">
                        <h3>${title}</h3>
                        <div class="price">$${price}</div>
                        <button class="btn" style="width: 100%; margin-top: auto;" onclick="buyNow('${title}', '${price}')">Buy Now</button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
